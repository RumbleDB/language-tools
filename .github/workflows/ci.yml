name: Test CI

on:
    push:
        branches:
            - main
    pull_request:

env:
    HUSKY: 0

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v6

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: pnpm

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: maven

            - name: Cache assembled RumbleDB JAR
              uses: actions/cache@v5
              with:
                  path: packages/rumble-lsp-wrapper/.cache/rumble
                  key: rumbledb-${{ runner.os }}-java17-${{ hashFiles('packages/rumble-lsp-wrapper/scripts/fetch-rumble.sh') }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate grammar
              run: pnpm run generate:grammar

            - name: Build
              run: pnpm run build

            - name: Run tests
              run: pnpm test
