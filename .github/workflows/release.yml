name: Release

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    HUSKY: 0

permissions:
    contents: write
    id-token: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        environment: release

        steps:
            - name: Check out repository
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up pnpm
              uses: pnpm/action-setup@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 26
                  cache: pnpm
                  registry-url: https://registry.npmjs.org

            - name: Set up Java
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: maven

            - name: Cache assembled RumbleDB JAR
              uses: actions/cache@v5
              with:
                  path: packages/rumble-lsp-wrapper/.cache/rumble
                  key: rumbledb-${{ runner.os }}-java17-${{ hashFiles('packages/rumble-lsp-wrapper/scripts/fetch-rumble.sh') }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Create release PR or publish packages
              id: changesets
              uses: changesets/action@v2
              with:
                  version-script: pnpm release:version
                  publish-script: pnpm release:publish
                  create-github-releases: false
                  push-git-tags: false
                  pr-title: "[ci] release"
                  commit-message: "[ci] release"
                  github-token: ${{ secrets.GITHUB_TOKEN }}
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
